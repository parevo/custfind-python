# Runs in the public mirror parevo/custfind-python. Edit it in the main repo
# (sdks/python/.github); changes made here are overwritten.
#
# Publishes with PyPI trusted publishing (no token): on pypi.org, add a
# (pending) publisher for project "custfind": owner parevo, repository
# custfind-python, workflow release.yml, environment pypi.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - name: Tag matches pyproject.toml
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already on PyPI (published by hand) is not an error.
          skip-existing: true
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
